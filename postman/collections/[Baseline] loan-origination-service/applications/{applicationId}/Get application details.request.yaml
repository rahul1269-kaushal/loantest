type: http
name: Get application details
url: '{{baseUrl}}/applications/:applicationId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: applicationId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "string",
            "applicantId": "string",
            "productType": "string",
            "requestedAmount": 8876.240328082784,
            "termMonths": 8114,
            "status": "denied",
            "createdAt": "2004-03-26T14:55:03.347Z",
            "updatedAt": "2015-03-15T17:08:20.216Z",
            "underwritingResult": {
              "applicationId": "string",
              "status": "in_progress",
              "decision": "referred_to_manual",
              "riskScore": 64,
              "evaluatedAt": "1949-10-12T11:30:49.122Z"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application details
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "code": "string",
            "message": "string",
            "details": {}
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Application not found
